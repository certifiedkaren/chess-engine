services:
  backend:
    image: chess-analyzer-backend:prod
    build:
      context: ./backend
      target: production
    container_name: chess-backend-prod
    environment:
      - STOCKFISH_PATH=/usr/games/stockfish
      - CORS_ORIGINS=http://localhost:8080,http://localhost
      - DATABASE_URL=postgresql+psycopg://chess_user:chess_password@db:5432/chess_analyzer
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: chess-analyzer-frontend:prod
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api
    container_name: chess-frontend-prod
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: chess-db-prod
    environment:
      POSTGRES_DB: chess_analyzer
      POSTGRES_USER: chess_user
      POSTGRES_PASSWORD: chess_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
